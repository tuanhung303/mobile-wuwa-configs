; WuWa mobile visual tune v2 (2026-10-23), REDMAGIC 11 Pro / Adreno 840 profile.
; Active levels from Client.log: ViewDistance@2 AA@2 Shadow@3 PostProcess@2 Texture@2 Effects@2 Foliage@2.
; @2 sections get Kuro's own higher-tier values; forbidden cvars left out (ConfigMonitor strips them).

; PostProcessQuality@2 from PostProcessQuality@3
[PostProcessQuality@2]
r.AmbientOcclusionMipLevelFactor=0.4
r.AmbientOcclusionRadiusScale=1.0
r.FastBlurThreshold=100
r.Filter.SizeScale=1
r.DOF.Gather.AccumulatorQuality=1
r.DOF.Gather.PostfilterMethod=1
r.DOF.Scatter.BackgroundCompositing=2
r.DOF.Scatter.EnableBokehSettings=1
r.DOF.Scatter.MaxSpriteRatio=0.1
r.DOF.Recombine.Quality=1
r.DOF.Recombine.EnableBokehSettings=0
r.DOF.TemporalAAQuality=1
r.DOF.Kernel.MaxForegroundRadius=0.025
r.DOF.Kernel.MaxBackgroundRadius=0.025

; EffectsQuality@2 from EffectsQuality@3
[EffectsQuality@2]
r.TranslucencyLightingVolumeDim=64
r.SSR.Quality=3
r.SSR.HalfResSceneColor=0
r.SSS.SampleSet=2
r.SSS.Quality=1
r.SSS.HalfRes=0
r.SSGI.Quality=3
r.EmitterSpawnRateScale=1.0
r.ParticleLightQuality=2
r.SkyAtmosphere.SampleCountMax=128.0
fx.Niagara.QualityLevel=2

; FoliageQuality@2 from FoliageQuality@3
[FoliageQuality@2]
foliage.DensityType=2
foliage.DensityScaleLOD.DensityType=2
foliage.DensityScaleLOD.DistanceType=2

; TextureQuality@2 from TextureQuality@4
[TextureQuality@2]
r.Streaming.Texture2DArrayNoStreamingThresholdMB=350

[ShadowQuality@3]
r.ShadowQuality=4
r.Shadow.CSM0ShadowPCFQuality=3
r.Shadow.CSM1ShadowPCFQuality=3
r.Shadow.CSM2ShadowPCFQuality=3
r.Shadow.CSM3ShadowPCFQuality=3
r.Shadow.PerObjectShadowMapResolution=1024
r.Shadow.PerObjectResolutionMax=1024
r.Shadow.SkeletalMeshLODBias=0
r.ShadowMask.Scale=1.0
r.Shadow.RadiusThreshold=0.01

[ViewDistanceQuality@2]
r.StaticMeshLODDistanceScale=0.75
